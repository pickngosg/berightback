<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box}
html{font-size:17px}
html[data-size=small]{font-size:15px}
html[data-size=large]{font-size:19px}
html[data-size=xl]{font-size:21px}
body{margin:0;font:1rem/1.45 "Segoe UI Variable","Segoe UI",Tahoma,Verdana,sans-serif;color:#13233f;min-height:100vh;background:#86addc;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 20% 15%,#f6fbff 0,transparent 70%),radial-gradient(45% 40% at 85% 25%,#d9f2e8 0,transparent 70%),radial-gradient(50% 45% at 55% 95%,#9cc3ee 0,transparent 70%),linear-gradient(160deg,#cfe3f8,#86addc);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.07)}}
body.login #app{display:grid;place-items:center;min-height:100vh}
.card{width:23rem;max-width:94vw;background:linear-gradient(#fff,#eaf3fc 70%,#dce9f8);border:1px solid #6f93c3;border-radius:1rem;box-shadow:0 0 0 .25rem #ffffff66,0 1.2rem 3rem #1d3f7466;padding:1.5rem 1.7rem 1.3rem;animation:pop .4s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:translateY(.9rem) scale(.96)}}
.card h2{margin:.4rem 0 .8rem;font-size:1.2rem;font-weight:600;text-align:center;color:#1f4170}
.logo{display:block;margin:0 auto;width:6rem;height:auto;border-radius:1.3rem;filter:drop-shadow(0 .35rem .7rem #1d3f7466)}
label{display:block;margin:.65rem 0 .25rem;font-size:.9rem;color:#3f5a82}
input,select,textarea{font:inherit;width:100%;padding:.5rem .7rem;border:1px solid #8aa9d0;border-radius:.45rem;background:#fff;color:inherit;box-shadow:inset 0 1px 2px #0001;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:#3d7fd6;box-shadow:0 0 0 .2rem #9cc3f5}
button{font:inherit;cursor:pointer;border:1px solid #7f9fcb;background:linear-gradient(#fdfeff 0,#eaf2fb 48%,#d3e3f6 52%,#e3eefa);border-radius:.45rem;padding:.35rem .9rem;color:#13233f;transition:transform .1s,box-shadow .15s,border-color .15s,background .15s}
button:hover{background:linear-gradient(#fff 0,#f1f7fd 48%,#c4dbf6 52%,#d9eafc);border-color:#4f86d1;box-shadow:0 .15rem .55rem #1d3f7433}
button:active{transform:translateY(1px) scale(.98)}
button:disabled{opacity:.6}
button.primary{width:100%;margin-top:1rem;padding:.6rem;background:linear-gradient(#cfe4fb 0,#a7cbf3 48%,#7fb1ec 52%,#9fc8f6);border-color:#4b7cc2;color:#0f2c55;font-weight:600}
button.danger{border-color:#c0392b;color:#a61e12}
button.link{border:0;background:none;color:#2b62b8;padding:.2rem;text-decoration:underline;box-shadow:none}
.err{color:#b42318;font-size:.9rem;margin-top:.5rem;min-height:1.2rem}
.ok{color:#1a7f37}
.center{text-align:center;margin-top:.6rem}
.main{position:fixed;left:1.4rem;top:1.4rem;bottom:1.4rem;width:min(25rem,calc(100vw - 2.8rem));display:flex;flex-direction:column;background:linear-gradient(#d3e6f9 0,#abcaec 4rem,#8fb4df);border:1px solid #4d74a8;border-radius:.9rem;box-shadow:0 0 0 1px #ffffffaa inset,0 1rem 3rem #12356588;overflow:hidden;animation:pop .4s cubic-bezier(.2,.9,.3,1.1)}
html.pop .main{display:none!important}
html.pop .win{inset:0!important;width:auto!important;height:auto!important;border-radius:0;resize:none;border:0}
html.pop .wtitle button,html.pop .rzy{display:none!important}
html.appwin body,html.appwin body::before{background:#e6eefa}
html.appwin .main{left:0;top:0;bottom:0;width:min(25rem,100vw);border-radius:0;border-width:0 1px 0 0;box-shadow:none}
@media(max-width:700px){html.appwin .main{inset:0!important;width:auto!important;border-width:0}
html.appwin body.login #app{display:block;min-height:100vh}
html.appwin .card{width:100%;max-width:none;min-height:100vh;border:0;border-radius:0;box-shadow:none;animation:none;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box}
html.appwin .card>*{width:100%;max-width:22rem}}
.main>*:not(.mtitle){margin-left:.5rem;margin-right:.5rem}
.mtitle{display:flex;align-items:center;gap:.5rem;padding:.45rem .6rem;color:#10294a;text-shadow:0 0 .4rem #fff,0 0 .2rem #fff}
.mtitle .logo{width:1.7rem;margin:0;filter:none;border-radius:.4rem}
.mtitle b{font-size:1rem;font-weight:600}
.mtitle .sp{flex:1}
.mtitle button{padding:0 .6rem;line-height:1.5rem;font-size:1rem}
.mhead{display:flex;gap:.8rem;padding:.7rem .8rem;background:linear-gradient(#fdfeff,#e3effb 55%,#d2e4f6);border:1px solid #a3bfe0;border-radius:.55rem .55rem 0 0}
.mhead .who{flex:1;min-width:0}
.nmrow{display:flex;align-items:baseline;gap:.2rem;min-width:0;flex-wrap:wrap}
.nm{font-weight:600;font-size:1.12rem;cursor:text;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#10294a}
.pm{color:#5f7191;cursor:text;min-height:1.4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1rem}
.pm.np,.l2.np,.wnp{color:#237a3b}
.stbtn{border:0!important;background:none!important;color:#33598f;padding:0 0 0 .2rem;font-size:.95rem;box-shadow:none!important;white-space:nowrap}
.stbtn:hover{text-decoration:underline}
.av{position:relative;flex:none;border-radius:.5rem;display:grid;place-items:center;border:1px solid #9db9de;cursor:default;overflow:hidden}
.av img,.av svg{width:100%;height:100%;display:block;object-fit:cover}
.av .dot{position:absolute;right:-.1rem;bottom:-.1rem;width:.8rem;height:.8rem;border-radius:50%;border:2px solid #fff}
.contacts{flex:1;overflow:auto;padding:.3rem .2rem;background:#fff;border:1px solid #a3bfe0;border-top:0;border-bottom:0}
.grp{display:flex;align-items:center;gap:.4rem;padding:.4rem .6rem;font-weight:600;color:#1f3d6b;cursor:pointer;user-select:none;transition:color .15s}
.grp:hover{color:#2b62b8}
.ct{display:flex;align-items:center;gap:.6rem;padding:.35rem .6rem .35rem .9rem;border:1px solid transparent;border-radius:.45rem;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.ct:hover{background:linear-gradient(#f4f9ff,#dcebfb);border-color:#bad3f0;transform:translateX(.15rem)}
.ct.flash{animation:flash 1.1s ease-in-out 4}
@keyframes flash{50%{background:#d8f5d0;border-color:#8fd57e}}
.ct .txt{flex:1;min-width:0}
.l1,.l2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 .n{font-weight:600}
.l1 .s,.l2,.ct .m{color:#6b7b93}
.l2{font-size:.88rem}
.ct.off .n{color:#7b8799;font-weight:500}
.ct .txt .n{color:#13233f}
.bd{flex:none;display:inline-flex}
.bd svg{width:1.3rem;height:1.3rem}
.badge{background:#e8590c;color:#fff;border-radius:1rem;padding:0 .5rem;font-size:.85rem;font-weight:700;animation:pulse 1.4s infinite}
@keyframes lgspin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.12)}100%{transform:rotate(360deg) scale(1)}}
.lgspin>*{animation:lgspin 2.6s ease-in-out infinite;transform-origin:50% 50%}
@keyframes pulse{50%{transform:scale(1.15)}}
.ct button{padding:0 .5rem;border-color:transparent;background:none;box-shadow:none;visibility:hidden}
.ct:hover button{visibility:visible}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:.85em;margin-right:.3rem;vertical-align:baseline}
.eq i{width:3px;background:#2b9348;border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(1){height:40%}
.eq i:nth-child(2){height:90%;animation-delay:.2s}
.eq i:nth-child(3){height:60%;animation-delay:.4s}
@keyframes eq{50%{transform:scaleY(.3)}}
.eq i{transform-origin:bottom}
.nbar{display:none;gap:.6rem;align-items:center;padding:.45rem .7rem;font-size:.9rem;background:linear-gradient(#fffbea,#fff1c9);border:1px solid #e6c37b;border-top:0}
.nbar button{white-space:nowrap;padding:.15rem .7rem}
.req{margin:.4rem;padding:.6rem;border:1px solid #e6c37b;background:linear-gradient(#fffbea,#fff1c9);border-radius:.55rem}
.req .row{display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}
.req button{padding:.15rem .7rem;font-size:.9rem}
#reqs{background:#fff;border-left:1px solid #a3bfe0;border-right:1px solid #a3bfe0}
.player{padding:.5rem .7rem;background:linear-gradient(#f4f9ff,#dbe9f8);border:1px solid #a3bfe0;border-bottom:0;border-top:1px solid #c5d7ee}
.ptitle{font-size:.92rem;color:#33598f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;margin-bottom:.3rem}
.prow{display:flex;align-items:center;gap:.25rem}
.prow button{padding:.1rem .6rem;min-width:2rem}
.prow input[type=range]{flex:1;padding:0;margin:0 .3rem;box-shadow:none;border:0;height:1.1rem}
.pshare{display:flex;align-items:center;gap:.4rem;margin:.35rem 0 0;font-size:.88rem;color:#4b6285}
.pshare input{width:auto;box-shadow:none}
.pstat{font-size:.85rem;margin-top:.15rem;color:#237a3b}
.pstat.bad{color:#b42318}
.addmsg{padding:0 .8rem .25rem;font-size:.9rem;background:#eaf3fc;min-height:.3rem;border-left:1px solid #a3bfe0;border-right:1px solid #a3bfe0}
.addbar{display:flex;gap:.45rem;padding:.55rem .6rem;background:linear-gradient(#eef5fd,#d3e4f6);border:1px solid #a3bfe0;border-radius:0 0 .55rem .55rem;margin-bottom:.5rem}
.addbar input{flex:1;border-radius:1.2rem;padding:.4rem .9rem}
.win{position:fixed;width:min(46rem,100vw);height:min(37rem,100vh);min-width:22rem;min-height:26rem;resize:both;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(#d3e6f9 0,#abcaec 4rem,#8fb4df);border:1px solid #4d74a8;border-radius:.9rem;box-shadow:0 0 0 1px #ffffffaa inset,0 1.1rem 3rem #12356588;padding:0 .4rem .4rem;z-index:10;animation:winin .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes winin{from{opacity:0;transform:translateY(.8rem) scale(.96)}}
.win.min{display:none!important}
.win.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:translate(0)}10%{transform:translate(-14px,6px)}20%{transform:translate(12px,-8px)}30%{transform:translate(-12px,-6px)}40%{transform:translate(10px,8px)}50%{transform:translate(-9px,4px)}60%{transform:translate(8px,-5px)}70%{transform:translate(-6px,3px)}80%{transform:translate(4px,-2px)}}
.wtitle{display:flex;align-items:center;gap:.5rem;padding:.4rem .2rem .4rem .3rem;cursor:move;user-select:none;touch-action:none;color:#10294a;text-shadow:0 0 .4rem #fff,0 0 .2rem #fff}
.wtitle .tt{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtitle button{padding:0 .8rem;font-size:1.05rem;line-height:1.4rem;border-radius:0 0 .4rem .4rem;text-shadow:none}
.wtitle button.x{background:linear-gradient(#eaa99d,#d2503c 50%,#c0361f);border-color:#7c2314;color:#fff;font-weight:700}
.wtitle button.x:hover{background:linear-gradient(#f4b9ae,#e0614c 50%,#d04a33)}
.wsub{padding:.4rem .8rem;background:linear-gradient(#fff,#e6f0fb);border:1px solid #a3bfe0;border-bottom:0;border-radius:.4rem .4rem 0 0;font-size:.92rem;color:#3f5a82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wnp{display:none;align-items:center;padding:.25rem .8rem;background:linear-gradient(#f3fff3,#dff5df);border-left:1px solid #a3bfe0;border-right:1px solid #a3bfe0;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbody{flex:1;min-height:0;display:flex;background:#fff;border:1px solid #7f9fcb;border-radius:0 0 .4rem .4rem}
.wleft{flex:1;min-width:0;display:flex;flex-direction:column}
.wlog{flex:1;overflow:auto;padding:.6rem .9rem;background:#fff;border-bottom:1px solid #c5d7ee}

.wlog .sys{margin:.6rem 0;padding:.35rem .6rem;background:#f1f5fb;border-left:.25rem solid #8fb1dc;color:#5a6b85;font-size:.92rem;animation:slide .2s}
.wlog a{color:#2b62b8}
.media{margin-top:.2rem}
.media img,.media video{max-width:100%;max-height:17rem;border-radius:.6rem;border:1px solid #c5d7ee;display:block;cursor:zoom-in;background:#f1f5fb}

.lightbox{position:fixed;inset:0;z-index:400;background:#0a1226dd;display:grid;place-items:center;cursor:zoom-out;animation:slide .2s}
.lightbox img{max-width:95vw;max-height:92vh;border-radius:.6rem;box-shadow:0 1rem 3rem #000a}
.wtyping{height:1.4rem;padding:0 .9rem;font-size:.88rem;color:#7a869b;font-style:italic;background:#fff}
.wtyping:not(:empty)::after{content:"";animation:dots 1.2s steps(1) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.wtools{display:flex;gap:.2rem;padding:.25rem .6rem;background:linear-gradient(#f7fbff,#e2eefa);border-top:1px solid #c5d7ee;align-items:center;position:relative;flex-wrap:wrap}
.wtools button{padding:.1rem .4rem;border-color:transparent;background:none;box-shadow:none}
.wtools button:hover{border-color:#7f9fcb;background:linear-gradient(#fff,#d6e6f8)}
.wtools button.on{background:#bcd6f6;border-color:#7f9fcb}
.sw{width:1.05rem;height:1.05rem;border-radius:50%;padding:0!important;border:2px solid #fff!important;box-shadow:0 0 0 1px #8fa!important}
.wbottom{display:flex;gap:.45rem;padding:.45rem .6rem;background:#f3f8ff}
.wbottom textarea{resize:vertical;height:3.6rem;min-height:3.6rem;max-height:14rem}

.wside{width:9rem;flex:none;background:linear-gradient(#f4f9fe,#d4e4f5);border-left:1px solid #b6cce6;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:.8rem 0}
.pic{width:7rem;height:7rem;border:3px solid #9db9de;border-radius:.5rem;background:#fff;overflow:hidden;box-shadow:0 .1rem .4rem #0003;transition:border-color .3s}
.pic .av{border:0!important;border-radius:0!important;width:100%!important;height:100%!important;font-size:3.6rem!important}
.emopop{position:absolute;bottom:2.4rem;left:.4rem;background:#fff;border:1px solid #8fb1dc;border-radius:.5rem;padding:.4rem;display:grid;grid-template-columns:repeat(8,1fr);gap:.1rem;box-shadow:0 .4rem 1.4rem #0003;z-index:5;animation:slide .15s}

.emopop span:hover{background:#e0ecfb}
.menu{position:fixed;z-index:500;background:linear-gradient(#fff,#f1f6fc);border:1px solid #7f9fcb;border-radius:.5rem;box-shadow:0 .5rem 1.6rem #0004;padding:.25rem;min-width:11rem;animation:slide .12s}
.menu div{padding:.4rem .9rem;cursor:pointer;border-radius:.3rem}
.menu div:hover{background:linear-gradient(#e8f2fd,#c8defa)}
.menu hr{border:0;border-top:1px solid #dbe5f2;margin:.25rem 0}
.toast{position:fixed;right:1.1rem;bottom:1.1rem;z-index:350;width:min(20rem,92vw);display:flex;gap:.7rem;align-items:center;background:linear-gradient(#fbfdff,#d5e5f7);border:1px solid #5d86bb;border-radius:.7rem;box-shadow:0 .5rem 1.6rem #0005;padding:.6rem .8rem;cursor:pointer;animation:toastin .35s cubic-bezier(.2,.9,.3,1.1)}

.bigcard{position:fixed;right:1.1rem;z-index:360;width:min(25rem,94vw);display:flex;gap:1.1rem;align-items:center;background:linear-gradient(#ffffff,#cfe2f8);border:2px solid #4f7db8;border-radius:1rem;box-shadow:0 .8rem 2.4rem #0007;padding:1.1rem 1.3rem;cursor:pointer;animation:toastin .4s cubic-bezier(.2,.9,.3,1.1)}

.bigcard .bpic{flex:none;border-radius:.8rem;overflow:hidden;box-shadow:0 .2rem .7rem #0004;line-height:0}

.bigcard .btxt{min-width:0;font-size:1.25rem;line-height:1.35;color:#10294a;word-break:break-word}
.bigcard .btxt b{font-size:1.45rem}
.mmenu{display:flex}
.emi{width:1.35em;height:1.35em;vertical-align:-.3em;display:inline-block}
.gifm{display:block;max-width:240px;max-height:240px;border-radius:6px}
.emopop.gifpop{display:block;width:340px;max-width:92vw;padding:.5rem}.gifpop .gtop input{height:2rem;padding:0 .5rem;border:1px solid #8fb1dc;border-radius:.3rem;font-size:.9rem}.gifpop .gtop button{height:2rem;padding:0 .8rem}.gifpop .ggrid{min-height:60px;font-size:.85rem;color:#456}.gifpop .gtop{display:flex;gap:4px;margin-bottom:4px}.gifpop input{flex:1;min-width:0}.gifpop .ggrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:260px;overflow-y:auto}.gifpop .ggrid img{width:100%;height:90px;object-fit:cover;border-radius:4px;cursor:pointer}.gifpop .gpw{font-size:11px;opacity:.7;text-align:right;margin-top:3px}
.cemo{height:1.9em;max-width:3.2em;vertical-align:-.55em;object-fit:contain}
.themes{display:flex;gap:.5rem;margin:.2rem 0 .7rem}.thdot{width:1.9rem;height:1.9rem;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #9bbbe6;cursor:pointer;padding:0}.thdot.on{box-shadow:0 0 0 3px #1f4170}
.themed .main,.themed .win,.themed .mbox,.themed .menu,.themed .toast,.themed .bigcard{filter:hue-rotate(var(--th))}
.themed .main img,.themed .win img,.themed .mbox img,.themed .menu img,.themed .toast img,.themed .bigcard img,.themed .main video,.themed .win video,.themed .main .av,.themed .win .av,.themed .mbox .av,.themed .toast .av,.themed .bigcard .av,.themed .win canvas,.themed .main svg,.themed .win svg,.themed .menu svg,.themed .toast svg,.themed .bgrid,.themed .c4{filter:hue-rotate(calc(-1 * var(--th)))}
.mwide{width:min(46rem,96vw)}
.bgrid{--bs:min(2.15rem,10vw);display:grid;grid-template-columns:repeat(8,var(--bs));width:max-content;border:2px solid #3a2f1c;border-radius:.3rem;overflow:hidden;margin:.3rem 0}
.bc{width:var(--bs);height:var(--bs);display:grid;place-items:center;font-size:calc(var(--bs)*.72);line-height:1;user-select:none;cursor:pointer;position:relative}
.bc.lt{background:#f0d9b5}.bc.dk{background:#b58863}.bc.sel{outline:3px solid #2f7de1;outline-offset:-3px}.bc.lastm{box-shadow:inset 0 0 0 3px #f2c94c}.bc.chk{background:#ff8787}

.spage .sec{border:1px solid #b6cce6;border-radius:.6rem;padding:.6rem .8rem .7rem;margin:0 0 .8rem;background:#fbfdff}

async function startApp(user) {

    state.uid = user.id; state.authEmail = user.email || '';

    if (!p) {
      await sb.from('profiles').insert({ id: user.id, display_name: ((user.user_metadata && user.user_metadata.display_name) || 'User').slice(0, 30) });
      ({ data: p } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle());
